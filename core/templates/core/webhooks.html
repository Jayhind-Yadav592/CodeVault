{% extends 'core/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Webhook Subscriptions</h2>
    
    <div class="card mb-4">
        <div class="card-header bg-dark text-white">Add Webhook</div>
        <div class="card-body">
            <form>
                <input type="url" class="form-control mb-2" placeholder="https://your-domain.com/webhook-receiver">
                <button type="submit" class="btn btn-primary">Subscribe</button>
            </form>
        </div>
    </div>
    
    <h4>Configured Webhooks</h4>
    <table class="table">
        <thead>
            <tr>
                <th>Endpoint</th>
                <th>Events</th>
                <th>Failures</th>
                <th>Last Delivery</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="4">No webhooks configured.</td>
            </tr>
        </tbody>
    </table>
</div>
{% endblock %}
