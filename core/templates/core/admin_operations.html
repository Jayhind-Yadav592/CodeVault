{% extends 'core/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>System Health & Operations</h2>
    
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-dark text-white">Background Jobs</div>
                <div class="card-body">
                    <ul class="list-group">
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            Queued <span class="badge bg-secondary rounded-pill">0</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            Running <span class="badge bg-primary rounded-pill">0</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            Failed <span class="badge bg-danger rounded-pill">0</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-dark text-white">System Configuration & Flags</div>
                <div class="card-body">
                    <p><strong>Minimum LOC:</strong> 50,000</p>
                    <p><strong>Platform Fee:</strong> 10.0%</p>
                    <hr>
                    <p>Feature Flags active: <code>NEW_LICENSING_UI</code></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
