{% extends 'core/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Developer API Credentials</h2>
    <p>Manage your API Keys. Do not share these secrets.</p>
    
    <div class="card mb-4">
        <div class="card-header bg-dark text-white">Generate New Credential</div>
        <div class="card-body">
            <form method="post" action="#">
                {% csrf_token %}
                <input type="text" class="form-control mb-2" placeholder="Credential Name (e.g. CI/CD Pipeline)">
                <button type="submit" class="btn btn-primary">Generate</button>
            </form>
        </div>
    </div>
    
    <h4>Active Credentials</h4>
    <table class="table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Fingerprint</th>
                <th>Last Used</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="5">No credentials generated yet.</td>
            </tr>
        </tbody>
    </table>
</div>
{% endblock %}
