name: CodeVault CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: codevault_db
          POSTGRES_USER: cv_user
          POSTGRES_PASSWORD: cv_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django mypy flake8

    - name: Run Django Checks
      env:
        DATABASE_URL: postgres://cv_user:cv_password@localhost:5432/codevault_db
      run: python manage.py check

    - name: Run Migrations Check
      env:
        DATABASE_URL: postgres://cv_user:cv_password@localhost:5432/codevault_db
      run: python manage.py makemigrations --check --dry-run

    - name: Run Pytest
      env:
        DATABASE_URL: postgres://cv_user:cv_password@localhost:5432/codevault_db
      run: pytest
